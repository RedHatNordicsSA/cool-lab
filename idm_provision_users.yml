---

- name: Playbook to add users
  hosts: lab-eu-idm-01.arrowdemo.se
  tasks:

    - name: Create users
      redhat.rhel_idm.ipauser:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        state: present
        update_password: on_create
        users: "{{ enabled_users }}"
      tags: users

    - name: Ensure ipa admins group
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: admins
        state: present
      tags: groups

    - name: Ensure members in ipa admins group
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: admins
        action: member
        user: "{{ idm_admins }}"
      tags: groups

    - name: Ensure group Red Hat Ops (rhops)
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: rhops
        # gidnumber: 1100
      tags: groups

    - name: Ensure members in group Red Hat Ops (rhops)
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: rhops
        action: member
        user: "{{ rh_ops }}"
      tags: groups

    - name: Ensure group Arrow Ops (arrowops) with gid 2100
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: arrowops
        # gidnumber: 2100
      tags: groups

    - name: Ensure members in group Arrow Ops (arrowops)
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: arrowops
        action: member
        user: "{{ arrow_ops }}"
      tags: groups

    - name: Ensure group arrow (arrow) with gid 2101
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: arrow
        # gidnumber: 2101
      tags: groups

    - name: Ensure members in group arrow (arrow)
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: arrow
        action: member
        user: "{{ arrow }}"
      tags: groups

    - name: Ensure group ODH admins (odh_admins) with gid 2103
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: odh-admins
        # gidnumber: 2103
      tags: groups

    - name: Ensure members in group ODH admins (odh_admins)
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: odh-admins
        action: member
        user: "{{ odh_admins }}"
      tags: groups

    - name: Ensure group developers with gid 2104
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: developers
        # gidnumber: 2104
      tags: groups

    - name: Ensure group HIQ
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: hiq
      tags: groups

    - name: Ensure members in group developers
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: developers
        action: member
        user: "{{ developers }}"
      tags: groups

    - name: Create LDAP bind user for AAP
      community.general.ldap_entry:
        server_uri: "ldaps://{{ ipaserver_master_fqdn }}"
        bind_dn: cn=Directory Manager
        bind_pw: "{{ vault_ipadm_password }}"
        dn: "uid={{ aap_ldap_bind_username }},cn=sysaccounts,cn=etc,dc=eu,dc=arrow,dc=lab"
        validate_certs: false
        objectClass:
          - account
          - simpleSecurityObject
        attributes:
          description: AAP LDAP bind account
          userPassword: "{{ vault_aap_ldap_password }}"
          uid: "{{ aap_ldap_bind_username }}"
          passwordExpirationTime: 20320101000000Z
          nsIdleTimeout: 0
      tags:
        - users
        - aap

    - name: Ensure group AAP admins
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        description: Ansible Automation Platform admins
        name: aap_admins
      tags:
        - groups
        - aap

    - name: Ensure members in group AAP admins
      redhat.rhel_idm.ipagroup:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: aap_admins
        action: member
        user: "{{ aap_admins }}"
      tags:
        - groups
        - aap

    - name: Ensure self-service rule is present
      redhat.rhel_idm.ipaselfservice:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: "Users can manage their own name details"
        permission:
          - read
          - write
        attribute:
          - givenname
          - displayname
          - title
          - initials
      tags: selfservice

    - name: Ensure sudo rule for gods
      redhat.rhel_idm.ipasudorule:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: rhops_sudo_all_nopasswd
        cmdcategory: all
        description: Red Hat ops allow to ruin everything anywhere freely
        hostcategory: all
        sudooption:
          - '!authenticate'
        group:
          - rhops
      tags: sudo
