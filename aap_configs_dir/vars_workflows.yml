    survey_enabled: true
    survey_spec:
      description: ''
      name: ''
      spec:
        - choices: ''
          default: ''
          new_question: false
          question_description: >
            short name for the hostname. Use format rh-<whatever>-<number>,
            e.g.  rh-ikketest-10
          question_name: Host Name
          required: true
          type: text
          variable: short_name
    simplified_workflow_nodes:
