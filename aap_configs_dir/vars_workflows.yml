---
controller_workflows:

  - name: Add RHEL to OCPv
    description: Creates and preps rhel vm
    state: present
    inventory: Temporary Inventory
    limit: new_vms
    organization:
      name: Red Hat
      type: organization
    ask_variables_on_launch: true
    extra_vars:
      use_aap_inventory: true
    survey_enabled: true
    related:
      survey_spec:
        description: ''
        name: ''
        spec:
          - choices: ''
            default: ''
            formattedChoices:
              - choice: ''
                id: 0
                isDefault: false
            max: 1024
            min: 1
            new_question: false
            question_description: >
              short name for the hostname. Use format rh-<whatever>-<number>,
              e.g.  rh-ikketest-10
            question_name: Host Name
            required: true
            type: text
            variable: short_name
          - choices: "rhel8\nrhel9\nrhel10"
            default: rhel10
            new_question: true
            question_description: Select the RHEL version template
            question_name: RHEL template
            required: true
            type: multiplechoice
            variable: template
          - choices: 'vlan3103-rh-infra'
            default: vlan3103-rh-infra
            max: 1024
            min: 0
            new_question: true
            question_description: Into which vlan the VM goes.
            question_name: VLAN name
            required: true
            type: multiplechoice
            variable: net_name
          - choices: "u1.nano\nu1.micro\nu1.small\nu1.medium\nu1.2xmedium\nu1.large\nu1.xlarge\nu1.2xlarge\nu1.4xlarge\nu1.8xlarge\n"
            default: 'u1.small'
            max: 65536
            min: 512
            new_question: true
            question_description: Which model for VM
            question_name: Instance Type
            required: true
            type: multiplechoice
            variable: instancetype

    simplified_workflow_nodes:

      - identifier: 101-add-vm
        unified_job_template: Ensure VM State - OpenShift Virtualization
        success_nodes:
          - 201-add-to-satellite

      - identifier: 201-add-to-satellite
        unified_job_template: Add new hosts to Satellite
        success_nodes:
          - 301-add-vm-to-idm
          - 302-add-vm-to-monitoring

      # - identifier: 201-prep-rhel
      #   unified_job_template: Prepare new RHEL hosts
      #   success_nodes:
      #     - 301-add-vm-to-idm

      - identifier: 301-add-vm-to-idm
        unified_job_template: Add new hosts to IdM
        success_nodes:
          - 401-update-inventory

      - identifier: 302-add-vm-to-monitoring
        unified_job_template: Add new hosts to Zabbix
        success_nodes:
          - 401-update-inventory

      - identifier: 401-update-inventory
        unified_job_template: Update inventory source
        success_nodes:
          - 501-remove-from-inventory

      - identifier: 501-remove-from-inventory
        unified_job_template: Remove host from temp inventory

  - name: Add RHEL to VMware
    description: Creates and preps rhel10 vm
    state: present
    inventory:
      name: Temporary Inventory
    limit: new_vms
    organization:
      name: Red Hat
      type: organization
    ask_variables_on_launch: true
    extra_vars:
      use_aap_inventory: true
    survey_enabled: true
    survey_spec:
      description: ''
      name: ''
      spec:
        - choices: ''
          default: ''
          formattedChoices:
            - choice: ''
              id: 0
              isDefault: false
          max: 1024
          min: 1
          new_question: false
          question_description: >
            short name for the hostname. Use format rh-<whatever>-<number>,
            e.g.  rh-ikketest-10
          question_name: Host Name
          required: true
          type: text
          variable: short_name
        - choices: "rhel_9_3_image\nrhel_8_7_image"
          default: rhel_9_3_image
          new_question: true
          question_description: Select the RHEL version template
          question_name: RHEL template
          required: true
          type: multiplechoice
          variable: template
        - choices: "RH-seg-2990\nRH-seg-2991\nRH-seg-2992\nRH-seg-2993"
          default: RH-seg-2991
          max: 1024
          min: 0
          new_question: true
          question_description: Into which wlan the VM goes.
          question_name: VLAN name
          required: true
          type: multiplechoice
          variable: net_name
        - choices: "512\n1024\n2048\n4096\n8192\n16384\n32768\n65536"
          default: '4096'
          max: 65536
          min: 512
          new_question: true
          question_description: How much RAM in megabytes
          question_name: Memory MB
          required: true
          type: multiplechoice
          variable: memory_mb
        - choices: "1\n2\n4\n8\n16"
          default: '2'
          max: 16
          min: 1
          new_question: true
          question_description: How many CPU
          question_name: CPU
          required: true
          type: multiplechoice
          variable: num_cpu
        - choices: "poweredon\npoweredoff\nabsent"
          default: poweredon
          max: 1024
          min: 0
          new_question: true
          question_description: poweredon/off/absent
          question_name: VM state
          required: true
          type: multiplechoice
          variable: vm_state

    simplified_workflow_nodes:

      - identifier: 101-add-vm
        unified_job_template: Ensure VM State - VMware
        success_nodes:
          - 201-prep-rhel

      - identifier: 201-prep-rhel
        unified_job_template: Prepare new RHEL hosts
        success_nodes:
          - 301-add-vm-to-idm

      - identifier: 301-add-vm-to-idm
        unified_job_template: Add new hosts to IdM
        success_nodes:
          - 401-remove-from-inventory

      - identifier: 401-remove-from-inventory
        unified_job_template: Remove host from temp inventory


  - name: Nuke RHEL - VMware
    description: Unsubscribes idm, subs and insights and deletes VM
    state: present
    inventory: vmware-rh
    ask_limit_on_launch: true
    limit: do not loose all your VMs :)
    organization: Red Hat
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      description: ''
      name: ''
      spec:
        - choices: ''
          default: ''
          new_question: false
          question_description: >
            short name for the hostname. Use format rh-<whatever>-<number>,
            e.g.  rh-ikketest-10
          question_name: Host Name
          required: true
          type: text
          variable: short_name
    simplified_workflow_nodes:
      - identifier: 101-unsubscribe-host
        unified_job_template: Unsubscribe host
        # lookup_organization: rhops
        success_nodes:
          - 201-delete-from-vmware
          - 202-delete-from-idm

      - identifier: 201-delete-from-vmware
        unified_job_template: Delete VM from VMware
        # lookup_organization: rhops

      - identifier: 202-delete-from-idm
        unified_job_template: Remove host from IdM
        # lookup_organization: rhops

  - name: Nuke RHEL - OCPv
    description: Unsubscribes idm, subs and insights and deletes VM
    state: present
    inventory: ocp-isf
    ask_limit_on_launch: true
    limit: do not loose all your VMs :)
    organization: Red Hat
    ask_variables_on_launch: false
    survey_enabled: true
    survey_spec:
      description: ''
      name: ''
      spec:
        - choices: ''
          default: ''
          new_question: false
          question_description: >
            short name for the hostname. Use format rh-<whatever>-<number>,
            e.g.  rh-ikketest-10
          question_name: Host Name
          required: true
          type: text
          variable: short_name
    simplified_workflow_nodes:
      - identifier: 101-unsubscribe-host
        unified_job_template: Unsubscribe host
        success_nodes:
          - 201-delete-from-ocpv

      - identifier: 102-delete-from-zabbix
        unified_job_template: Remove hosts from Zabbix
        success_nodes:
          - 201-delete-from-ocpv

      - identifier: 103-delete-from-idm
        unified_job_template: Remove host from IdM
        success_nodes:
          - 201-delete-from-ocpv

      - identifier: 201-delete-from-ocpv
        unified_job_template: Delete VM from OCPv
        success_nodes:
          - 301-update-inventory

      - identifier: 301-update-inventory
        unified_job_template: Update inventory source

  - name: Add Disk to VM - VMware
    description: Adds new disk as LV at given mount point to VM
    state: present
    inventory:
      name: vmware-rh
    organization:
      name: Red Hat
      type: organization
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    limit: add_vm_short_name_here
    survey_enabled: true
    survey_spec:
      description: ''
      name: ''
      spec:
        - question_name: Disk size
          variable: vm_disksize
          default: '20GB'
          new_question: true
          question_description: Disk size, e.g. 20GB
          required: true
          type: text
        - question_name: Host name to which disk is added
          default: 'my-vm'
          new_question: true
          question_description: >
            To which host do you want to attach the disk to? In vmware
            inventory format.
          required: true
          type: text
          variable: short_name
        - question_name: Volume group name to which disk is added
          default: 'my-vg'
          new_question: true
          question_description: >
            To which volume group do you want to attach the disk to?
            This could be an existing one or new one.
          required: true
          type: text
          variable: vm_new_vg
        - question_name: Logical volume to which disk is added
          default: 'my-lv'
          new_question: true
          question_description: >
            To which logical volume do you want to use the disk for?
          required: true
          type: text
          variable: vm_new_lv
        - question_name: Mount point for the volume
          default: '/my-volume'
          new_question: true
          question_description: >
            What is the mount point for the volume? E.g. /database
          required: true
          type: text
          variable: vm_new_mount_point

    simplified_workflow_nodes:

      - identifier: 101-add-disk
        unified_job_template: Add disk to VM
        success_nodes:
          - 201-create-lv

      - identifier: 201-create-lv
        unified_job_template: Create LV to empty disk on VM
