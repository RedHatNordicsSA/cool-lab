---
- name: Receive stuff via webhook
  hosts: all
  sources:
    - name: Listen to any webhooks
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Debug anything
      condition: event.meta is defined
      action:
        ansible.builtin.debug:
          var: event
