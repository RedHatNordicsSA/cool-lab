---
- name: Receive stuff via webhook
  hosts: all
  sources:
    - name: Listen to any webhooks
      eda.builtin.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Apache problems
      condition:
        all:
          - event.meta is defined
          - event.payload.event_name is search("Apache.*(not running|is down)", ignorecase=true)
      actions:
        - debug:
            var: event
        - run_workflow_template:
            name: "AIOps Webserver Rescue Workflow"
            organization: "Red Hat"
            extra_vars:
              short_name: "{{ event.payload.host_host.split('.')[0] }}"
              target: "{{ event.payload.host_host }}"
              problem: "{{ event.payload.trigger_name }}"
    - name: debug anything
      condition: event.meta is defined
      action:
        debug:
          var: event
        # run_job_template:
        #   name: "Run Claude to analyse and fix"
        #   organization: "Default"
