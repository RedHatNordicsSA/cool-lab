    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: group-sync-operator
        api_version: v1
        kind: Namespace
        state: present

    - name: Put ldap-CA cert in place for IdM auth
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          data:
            username: >
              dWlkPW9wZW5zaGlmdCxjbj1zeXNhY2NvdW50cyxjbj1ldGMsZGM9ZXUsZGM9YXJyb3csZGM9bGFiCg==
            password: "{{ vault_ocp_bind_pwd | b64encode }}"
          kind: Secret
          metadata:
            name: ldap-group-sync
            namespace: group-sync-operator
          type: Opaque

    - name: Install OpenShift GitOps
      kubernetes.core.k8s:
        definition:
          "{{ lookup('kubernetes.core.kustomize',
              dir='ocp-configs/gitops/mgt-eu-arrow-lab/openshift-gitops-operator/operator/overlays/gitops-latest') }}"

    - name: Ensure App of Apps
      kubernetes.core.k8s:
        state: present
        src: app-of-apps/app-of-apps.yaml
