---

- name: "Ensure VM state"
  hosts: localhost
  vars:
    ns: rh-infra
    net_name: vlan3103-rh-infra
  tasks:

    - name: "Create Namespace {{ ns }}"
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        state: present
        name: "{{ ns }}"
      when: vm_state == "present"

    - name: Ensure VM is "{{ vm_state }}"
      redhat.openshift_virtualization.kubevirt_vm:
        state: "{{ vm_state | default('present')}}"
        name: "{{ short_name }}"
        namespace: "{{ ns }}"
        labels:
          rh-infra: "aap-generated"
        instancetype:
          name: "{{ instancetype | default('u1.small')}}"
        preference:
          name: "{{ vm_preference | default('fedora')}}"
        run_strategy: Always
        data_volume_templates:
          - metadata:
              name: "{{ short_name }}-volume"
            spec:
              sourceRef:
                kind: DataSource
                name: "{{ vm_data_source | default('rhel9')}}"
                namespace: openshift-virtualization-os-images
              storage:
                resources:
                  requests:
                    storage: "{{ vm_disk_gb | default('32')}}Gi"
                storageClassName: ocs-storagecluster-ceph-rbd-virtualization
        spec:
          domain:
            devices:
              autoattachPodInterface: false
              disks:
              - bootOrder: 1
                name: rootdisk
              interfaces:
                # - name: default
                #   masquerade: {}
                - name: "{{ short_name }}-bridge-network"
                  model: virtio
                  bridge: {}
                  state: up
          networks:
            # - name: default
            #   pod: {}
            - name: "{{ short_name }}-bridge-network"
              multus:
                networkName: "{{ net_name }}"
          subdomain: headless
          volumes:
            - dataVolume:
                name: "{{ short_name }}-volume"
              name: rootdisk
            - cloudInitNoCloud:
                userData: |-
                  #cloud-config
                  users:
                    - default
                    - name: ansible
                      groups: wheel
                      sudo: ALL=(ALL) NOPASSWD:ALL
                      ssh_authorized_keys: 
                        - "{{ lab_admin_ssh_pubkey }}"
                    - name: root
                      ssh_authorized_keys: 
                        - "{{ lab_admin_ssh_pubkey }}"
                  chpasswd:
                    expire: false
                  ssh_authorized_keys: 
                    - "{{ lab_admin_ssh_pubkey }}"
                #   rh_subscription:
                #     username: "{{ vault_rh_subs_username }}"
                #     password: "{{ vault_rh_subs_password }}"
                #     auto-attach: True
                #    package_upgrade: true
                # networkData: |-
                #   #network-config
                #   network:
                #     version: 2
                #     ethernets:
                #       eth0:
                #         addresses:
                #           - 10.3.103.12/24
                #         gateway: 10.3.103.1
                #         nameservers:
                #           addresses:
                #             - "{{ ipaserver_master_ip }}"
                #             - "{{ ipaserver_replica_ip }}"
                #         routes:
                #           - to: 0.0.0.0/0
                #             via: 10.3.103.1
              name: cloudinit
        wait: true

    - name: Wait for VM IP to be populated
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ short_name }}"
        namespace: "{{ ns }}"
      register: deploy_collection_vmi
      retries: 60
      delay: 10
      until: (deploy_collection_vmi.resources[0].status.interfaces[0]['ipAddress'] | default('')) | length > 0
      when: vm_state == "present"

    - name: VM address
      debug:
        msg: "VM {{ short_name }} IP address is {{ deploy_collection_vmi.resources[0].status.interfaces[0]['ipAddress'] }}"
      when: vm_state == "present"

