lab_admin_ssh_pubkey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHV4O/qEctm+YmAY/o0aKk+sgxbFhLMsNN1m4j8FNKSF admin@coollab

vcenter_datacenter: DC3
vcenter_cluster: DC3-cl01
vcenter_folder: EU
vcenter_datastore: fs5200-LUN0

# RHEL subscriptions

rh_subs_username: "{{ vault_rh_subs_username }}"
rh_subs_password: "{{ vault_rh_subs_password }}"
subs_pool: Employee SKU
enabled_repos_rhel:
  '8':
    - rhel-8-for-x86_64-appstream-rpms
    - rhel-8-for-x86_64-baseos-rpms
    - ansible-2-for-rhel-8-x86_64-rpms
  '9':
    - rhel-9-for-x86_64-appstream-rpms
    - rhel-9-for-x86_64-baseos-rpms
    - ansible-automation-platform-2.2-for-rhel-9-x86_64-rpms

# see guide here: https://galaxy.ansible.com/freeipa/ansible_freeipa
dns_forwarder1_ip: 10.1.102.5
dns_forwarder2_ip: 10.1.102.10
dns_reverse_zones:
   - 103.0.10.in-addr.arpa.
   - 109.3.10.in-addr.arpa.
   - 203.3.10.in-addr.arpa.
ipaservers:
  - lab-eu-idm-01.arrowdemo.se
  - arw-eu-idm-02.eu.arrow.lab
ipaserver_master_ip: 10.0.103.25
ipaserver_master_fqdn: lab-eu-idm-01.arrowdemo.se
ipaserver_replica_ip: 10.3.109.25
ipaserver_replica_name: arw-eu-idm-02.eu.arrow.lab
ipaserver_domain: eu.arrow.lab
ipaserver_realm: EU.ARROW.LAB
ipaserver_gw: 10.0.103.1
ipaadmin_principal: admin
ipaclient_ntp_servers: true
ipaclient_mkhomedir: true
ipaadmin_password: "{{ vault_ipaadmin_password }}"
ipasssd_enable_dns_updates: true

# define the idm host groups
hostgroups:
  - name: infra
    description: Infrastructure Hosts
    hosts:
      - lab-eu-idm-01.arrowdemo.se
      - arw-eu-idm-02.eu.arrow.lab
      - arw-eu-bastion-01.eu.arrow.lab
  - name: ipaservers
    description: IdM cluster hosts
    hosts:
      - arw-eu-idm-01.arrowdemo.eu
      - arw-eu-idm-02.eu.arrow.lab

aap_ldap_bind_username: aap_ldap
aap_hostname: arrowlab-aap.apps.acm.eu.arrow.lab

ah_hostname: rh-automation-hub-01.cool.lab
ah_username: "admin"
ah_password: "{{ aap_admin_password }}"
# redhat automatin hub
ah_oauthtoken: "{{ vault_aap_automationhub_token }}"
# local private aap automatin hub
pah_oauthtoken: "{{ vault_aap_private_automationhub_token }}"
ah_validate_certs: false

satellite_ip: 10.128.1.17
satellite_foreman_pubkey: ssh-rsa  foreman-proxy@rh-satellite-01.cool.lab
